<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>SKD Coach — Belajar SKD CPNS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070c18; --bg2:#0d1527; --card:#111c33; --card2:#182644; --line:#26385e; --line-hi:rgba(255,255,255,.08);
  --text:#f0f4fc; --muted:#9fb0cf;
  --amber:#f5b942; --amber-ink:#1a1202; --amber-soft:rgba(245,185,66,.15); --amber-line:rgba(245,185,66,.4);
  --teal:#2dd4bf; --teal-soft:rgba(45,212,191,.14); --teal-line:rgba(45,212,191,.38);
  --red:#fb7185; --red-soft:rgba(251,113,133,.14); --red-line:rgba(251,113,133,.38);
  --green:#34d399; --green-soft:rgba(52,211,153,.14); --green-line:rgba(52,211,153,.38);
  /* Warna Semantik Psikologi Kognitif per Subtes:
     TWK = Crimson-Rose (atensi fakta, sejarah & pasal)
     TIU = Sky-Cyan (fokus analitis, pola & logika)
     TKP = Emerald-Teal (empati, pelayanan & harmoni sosial) */
  --twk:#fb7185; --twk-soft:rgba(251,113,133,.15); --twk-line:rgba(251,113,133,.42);
  --tiu:#38bdf8; --tiu-soft:rgba(56,189,248,.15); --tiu-line:rgba(56,189,248,.42);
  --tkp:#34d399; --tkp-soft:rgba(52,211,153,.15); --tkp-line:rgba(52,211,153,.42);
  --shadow:0 12px 32px -4px rgba(2,6,18,.55), inset 0 1px 0 rgba(255,255,255,.06);
  --radius:20px; --radius-sm:13px;
  --font-head:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#f6f3eb; --bg2:#ede8da; --card:#ffffff; --card2:#f7f3e8; --line:#dcd3be; --line-hi:rgba(255,255,255,.8);
  --text:#13203c; --muted:#4b5873;
  --amber:#b4690e; --amber-ink:#ffffff; --amber-soft:rgba(180,105,14,.12); --amber-line:rgba(180,105,14,.35);
  --teal:#0d746b; --teal-soft:rgba(13,116,107,.12); --teal-line:rgba(13,116,107,.35);
  --red:#be123c; --red-soft:rgba(190,18,60,.1); --red-line:rgba(190,18,60,.32);
  --green:#047857; --green-soft:rgba(4,120,87,.12); --green-line:rgba(4,120,87,.32);
  --twk:#be123c; --twk-soft:rgba(190,18,60,.11); --twk-line:rgba(190,18,60,.35);
  --tiu:#0369a1; --tiu-soft:rgba(3,105,161,.11); --tiu-line:rgba(3,105,161,.35);
  --tkp:#047857; --tkp-soft:rgba(4,120,87,.11); --tkp-line:rgba(4,120,87,.35);
  --shadow:0 10px 26px -4px rgba(32,26,10,.09), inset 0 1px 0 rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.6;min-height:100vh;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 12% -8%, rgba(245,185,66,.10), transparent 65%),
    radial-gradient(ellipse 70% 50% at 92% 105%, rgba(45,212,191,.08), transparent 65%),
    radial-gradient(ellipse 55% 40% at 85% 15%, rgba(56,189,248,.06), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.25;margin:0 0 .4em;letter-spacing:-.015em}
h1{font-size:1.75rem;font-weight:800} h2{font-size:1.3rem;font-weight:800} h3{font-size:1.08rem;font-weight:700}
p{margin:0 0 .8em} a{color:var(--amber);text-underline-offset:3px}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--amber);color:var(--amber-ink);padding:10px 14px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.95;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:26px;height:26px} svg.i.sm{width:16px;height:16px}

/* layout */
.app{display:block;min-height:100vh}
.side{display:none}
.main{padding:18px 16px 115px;max-width:1040px;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 24px rgba(0,0,0,.28)}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:700;transition:color .15s}
.bottom a[aria-current="page"]{color:var(--amber)}
@media(min-width:900px){
  .app{display:grid;grid-template-columns:264px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--bg2);overflow-y:auto}
  .bottom{display:none}
  .main{padding:32px 38px 68px;width:100%}
  .side a{display:flex;align-items:center;gap:12px;min-height:44px;padding:9px 14px;border-radius:13px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.93rem;transition:all .15s;border:1px solid transparent}
  .side a:hover{background:var(--card);color:var(--text)}
  .side a[aria-current="page"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);font-weight:700}
}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--font-head);font-weight:800;font-size:1.2rem;padding:4px 10px 14px;letter-spacing:-.02em}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#e09616);color:var(--amber-ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(245,185,66,.32)}
.side-meta{margin:0 6px 14px;padding:10px 12px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:700}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar .brand{padding:0}
@media(min-width:900px){.topbar .brand{display:none}.topbar{justify-content:flex-end;margin-bottom:8px}}

/* cards & surface hierarchy */
.card{background:linear-gradient(170deg,var(--card2) 0%,var(--card) 100%);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative}
.card+.card{margin-top:16px}
.card.flat{box-shadow:none;background:var(--bg2)}
.card.hero{
  background:
    radial-gradient(circle at 95% 10%, rgba(245,185,66,.14), transparent 55%),
    radial-gradient(circle at 5% 95%, rgba(45,212,191,.10), transparent 55%),
    linear-gradient(165deg,var(--card2),var(--card));
  border-color:var(--amber-line);
}
.card.sub-twk,.card.sub-TWK{border-top:4px solid var(--twk)}
.card.sub-tiu,.card.sub-TIU{border-top:4px solid var(--tiu)}
.card.sub-tkp,.card.sub-TKP{border-top:4px solid var(--tkp)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr} .g3{grid-template-columns:1fr}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.stack>*+*{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin-bottom:6px}
.big{font-family:var(--font-head);font-size:2.15rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}

/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:600 .94rem var(--font-body);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
.btn:hover:not([disabled]){background:var(--line);border-color:var(--muted)}
.btn:active:not([disabled]){transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#f8c455,var(--amber));color:var(--amber-ink);border-color:var(--amber);font-weight:700;box-shadow:0 4px 16px rgba(245,185,66,.26)}
.btn.primary:hover:not([disabled]){filter:brightness(1.06);background:linear-gradient(180deg,#f8c455,var(--amber))}
.btn.teal{background:var(--teal);color:#04201c;border-color:var(--teal);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not([disabled]){background:var(--card2);border-color:var(--line)}
.btn.danger{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
@keyframes redBreath{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.62),0 4px 14px rgba(220,38,38,.35);filter:brightness(1)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0),0 0 22px 4px rgba(239,68,68,.75);filter:brightness(1.12)}}
.btn.red-breath{background:linear-gradient(180deg,#ef4444,#dc2626);color:#fff;border:1.5px solid #fca5a5;font-weight:800;animation:redBreath 1.8s ease-in-out infinite}
.btn.red-breath:hover:not([disabled]){background:linear-gradient(180deg,#f87171,#dc2626);border-color:#fecaca}
.btn.xl{min-height:60px;font-size:1.1rem;width:100%;border-radius:18px;font-family:var(--font-head);font-weight:800;letter-spacing:-.01em}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:44px;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--amber);flex:none}
.field{margin-bottom:14px}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:500;cursor:pointer}
.check label{margin:0;font-weight:500;cursor:pointer}
.form-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}
.err{color:var(--red);font-size:.88rem;margin-top:4px;font-weight:600}
.ok-text{color:var(--green);font-weight:600}

/* semantic chips & subtest badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.76rem;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.chip.teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.chip.green{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.chip.twk,.chip.sub-TWK{background:var(--twk-soft);color:var(--twk);border-color:var(--twk-line)}
.chip.tiu,.chip.sub-TIU{background:var(--tiu-soft);color:var(--tiu);border-color:var(--tiu-line)}
.chip.tkp,.chip.sub-TKP{background:var(--tkp-soft);color:var(--tkp);border-color:var(--tkp-line)}
.unv{background:var(--amber-soft);color:var(--amber);border:1px dashed var(--amber-line);padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700}

/* progress & stats */
.bar{height:11px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#34d399);border-radius:99px;transition:width .5s}
.bar.amber>i{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.bar.twk>i{background:linear-gradient(90deg,var(--twk),#fda4af)}
.bar.tiu>i{background:linear-gradient(90deg,var(--tiu),#7dd3fc)}
.bar.tkp>i{background:linear-gradient(90deg,var(--tkp),#6ee7b7)}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rt{position:absolute;text-align:center;font-family:var(--font-head);font-weight:800;line-height:1.1}
.ring circle{transition:stroke-dashoffset .7s}
.stat{display:flex;align-items:center;gap:14px}
.stat .ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line);flex:none}
.stat .ico.teal{background:var(--teal-soft);color:var(--teal);border-color:var(--teal-line)}
.stat .ico.twk{background:var(--twk-soft);color:var(--twk);border-color:var(--twk-line)}
.stat .ico.tiu{background:var(--tiu-soft);color:var(--tiu);border-color:var(--tiu-line)}
.stat .ico.tkp{background:var(--tkp-soft);color:var(--tkp);border-color:var(--tkp-line)}

/* steps list */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.steps li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);transition:border-color .15s}
.steps .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;background:var(--card2);color:var(--muted);flex:none;border:1px solid var(--line)}
.steps li.done{border-color:var(--teal-line);background:rgba(45,212,191,.05)}
.steps li.done .n{background:var(--teal);color:#04201c;border-color:var(--teal)}
.steps li.cur{border-color:var(--amber);background:var(--amber-soft)}
.steps li.cur .n{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.steps .m{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap;font-weight:700}

/* kalender */
.cal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(154px,1fr))}
.day{background:var(--bg2);border:1.5px solid var(--line);border-radius:15px;padding:12px 13px;min-height:98px;display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--text);font:inherit;cursor:pointer;width:100%;transition:transform .12s,border-color .15s}
.day:hover{border-color:var(--amber);transform:translateY(-2px)}
.day .k{font-family:var(--font-head);font-weight:800;font-size:1.05rem}
.day.today{border:2px solid var(--amber);background:var(--amber-soft);box-shadow:0 0 20px rgba(245,185,66,.16)}
.day.selesai{border-color:var(--teal-line);background:rgba(45,212,191,.06)}
.day.terlewat{opacity:.72;border-style:dashed}
.day.ujian{border-color:var(--amber);background:var(--amber-soft)}
.phase-h{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* kuis & tactile options */
.qcard{background:linear-gradient(170deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.qtext{font-size:1.08rem;line-height:1.65;white-space:pre-line;margin:14px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:13px 15px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:inherit;cursor:pointer;transition:border-color .14s,background .14s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--amber);background:var(--card2);transform:translateX(2px)}
.opt .L{width:32px;height:32px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-head);font-weight:800;font-size:.86rem;flex:none;transition:all .14s}
.opt:hover:not([disabled]) .L{border-color:var(--amber);color:var(--amber)}
.opt[aria-checked="true"]{border-color:var(--amber);background:var(--amber-soft)}
.opt[aria-checked="true"] .L{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .L{background:var(--green);color:#032219;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .L{background:var(--red);color:#2a040d;border-color:var(--red)}
.opt[disabled]{cursor:default}
.opt .sc{margin-left:auto;flex:none}
.opts.opts-visual{grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:11px}
.opt.has-svg{align-items:center;padding:11px 14px;gap:12px}
.opt-svg{display:inline-flex;align-items:center;justify-content:center;width:78px;height:78px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);flex:none;padding:4px}
.opt[aria-checked="true"] .opt-svg{border-color:var(--amber);background:rgba(245,185,66,.08)}
.opt.correct .opt-svg{border-color:var(--green)}
.opt.wrong .opt-svg{border-color:var(--red)}
.vis-stage{margin:12px 0 16px;padding:14px 16px;background:rgba(56,189,248,.055);border:1.5px dashed rgba(56,189,248,.36);border-radius:15px;overflow-x:auto}
.vis-stage .vis-cap{font-size:.76rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tiu);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 4px;font-family:var(--font-head);font-weight:800}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 5px 2px}
.frac>span:last-child{padding:2px 5px 0}
.seq-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:4px 0}
.seq-node{min-width:44px;padding:8px 11px;border-radius:11px;background:var(--bg2);border:1.5px solid var(--line);font-family:var(--font-head);font-weight:800;font-size:1.04rem;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.seq-node.l1{border-color:rgba(56,189,248,.5);color:var(--tiu)}
.seq-node.l2{border-color:rgba(245,185,66,.5);color:var(--amber)}
.seq-node.q{border:2px dashed var(--amber);background:var(--amber-soft);color:var(--amber)}
.seq-arr{color:var(--muted);font-weight:800;font-size:.9rem}
.feedback{margin-top:14px;padding:13px 16px;border-radius:14px;font-weight:700;display:flex;align-items:center;gap:10px}
.feedback.good{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
.feedback.bad{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.feedback.mid{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.expl{margin-top:12px;padding:16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--teal);white-space:pre-line;line-height:1.65}
.timer{font-family:var(--font-head);font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* =====================================================================
   KOMPONEN VISUAL MEMORY & NEURO-DESIGN (MATERI RINGKAS & ACTIVE RECALL)
   ===================================================================== */
mark.hl{
  background:var(--amber-soft);color:var(--amber);padding:1px 6px;border-radius:6px;
  font-weight:700;border:1px solid var(--amber-line);
}
mark.hl-teal{
  background:var(--teal-soft);color:var(--teal);padding:1px 6px;border-radius:6px;
  font-weight:700;border:1px solid var(--teal-line);
}
.sub-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.sub-tab{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 16px;
  border-radius:16px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);
  text-decoration:none;transition:all .15s;cursor:pointer;
}
.sub-tab:hover{transform:translateY(-2px);border-color:var(--muted)}
.sub-tab .st-code{font-family:var(--font-head);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;width:100%;justify-content:space-between}
.sub-tab .st-desc{font-size:.78rem;color:var(--muted);font-weight:500}
.sub-tab.active-TWK{background:var(--twk-soft);border-color:var(--twk);box-shadow:0 6px 20px rgba(251,113,133,.15)}
.sub-tab.active-TWK .st-code{color:var(--twk)}
.sub-tab.active-TIU{background:var(--tiu-soft);border-color:var(--tiu);box-shadow:0 6px 20px rgba(56,189,248,.15)}
.sub-tab.active-TIU .st-code{color:var(--tiu)}
.sub-tab.active-TKP{background:var(--tkp-soft);border-color:var(--tkp);box-shadow:0 6px 20px rgba(52,211,153,.15)}
.sub-tab.active-TKP .st-code{color:var(--tkp)}
@media(max-width:620px){.sub-tabs{grid-template-columns:1fr}}

/* Bar kendali Mode Uji Ingatan (Active Recall) */
.memory-bar{
  position:sticky;top:8px;z-index:18;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--amber-line);
  box-shadow:var(--shadow);margin-bottom:16px;
}
.memory-bar.active{border-color:var(--teal);background:linear-gradient(90deg,var(--card),rgba(45,212,191,.12))}

/* Jembatan Keledai (Mnemonic Anchor Box - Von Restorff Isolation Effect) */
.mnemonic-box{
  margin:14px 0;padding:15px 18px;border-radius:16px;
  background:linear-gradient(135deg,rgba(245,185,66,.18),rgba(245,185,66,.06));
  border:1.5px solid var(--amber-line);border-left:5px solid var(--amber);
  display:flex;gap:14px;align-items:flex-start;
}
.mnemonic-box .m-ico{
  width:40px;height:40px;border-radius:12px;background:var(--amber);color:var(--amber-ink);
  display:grid;place-items:center;flex:none;font-weight:800;
}
.mnemonic-box .m-title{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--amber);margin-bottom:3px}
.mnemonic-box .m-body{font-weight:700;font-size:.98rem;line-height:1.5}

/* Peta Konsep Visual (Chunking Dual-Coding Grid) */
.peta-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:10px 0 16px}
.peta-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.peta-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal)}
.peta-card.sub-TWK::before{background:var(--twk)}
.peta-card.sub-TIU::before{background:var(--tiu)}
.peta-card.sub-TKP::before{background:var(--tkp)}
.peta-k{font-family:var(--font-head);font-weight:800;font-size:.9rem;color:var(--amber);display:flex;align-items:center;justify-content:space-between;gap:6px}
.peta-card.sub-TWK .peta-k{color:var(--twk)}
.peta-card.sub-TIU .peta-k{color:var(--tiu)}
.peta-card.sub-TKP .peta-k{color:var(--tkp)}
.peta-v{font-size:.9rem;line-height:1.48;color:var(--text)}

/* Kartu Hafalan Kilat (Active Recall Flip / Tap-to-Reveal) */
.flash-grid{display:grid;gap:10px;grid-template-columns:1fr;margin:10px 0 16px}
@media(min-width:680px){.flash-grid{grid-template-columns:1fr 1fr}}
.flash-card{
  background:var(--bg2);border:1.5px solid var(--amber-line);border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .12s,border-color .15s;
  text-align:left;color:var(--text);font:inherit;width:100%;
}
.flash-card:hover{transform:translateY(-2px);border-color:var(--amber)}
.flash-q{font-weight:800;font-size:.88rem;color:var(--amber);display:flex;align-items:center;justify-content:space-between;gap:8px}
.flash-a{font-size:.92rem;line-height:1.5;color:var(--text);transition:filter .2s,opacity .2s}
.cloak-mode .flash-card:not(.revealed) .flash-a,
.cloak-mode .peta-card:not(.revealed) .peta-v,
.cloak-mode mark.hl:not(.revealed){
  filter:blur(6px);user-select:none;opacity:.55;cursor:pointer;
}
.cloak-hint{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);font-weight:700}
.cloak-mode .flash-card:not(.revealed) .cloak-hint{background:var(--amber-soft);color:var(--amber)}

/* Jebakan vs Trik Cepat Callout Grid */
.tip-grid{display:grid;gap:10px;grid-template-columns:1fr;margin:10px 0 14px}
@media(min-width:680px){.tip-grid{grid-template-columns:1fr 1fr}}
.tip-box{padding:13px 15px;border-radius:14px;font-size:.91rem;line-height:1.55;display:flex;gap:11px;align-items:flex-start}
.tip-box.trap{background:var(--red-soft);border:1px solid var(--red-line);color:var(--text)}
.tip-box.trap .t-tag{color:var(--red);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.tip-box.trick{background:var(--teal-soft);border:1px solid var(--teal-line);color:var(--text)}
.tip-box.trick .t-tag{color:var(--teal);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}

/* Inti Materi Scannable List */
.inti-list{list-style:none;margin:8px 0 14px;padding:0;display:grid;gap:8px}
.inti-list li{
  position:relative;padding:10px 14px 10px 36px;border-radius:12px;
  background:var(--bg2);border:1px solid var(--line);font-size:.94rem;line-height:1.6;
}
.inti-list li::before{
  content:"✦";position:absolute;left:13px;top:11px;color:var(--amber);font-weight:800;font-size:.85rem;
}
.topic-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topic-pill{
  padding:7px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);
  color:var(--text);text-decoration:none;font-size:.84rem;font-weight:700;transition:all .15s;cursor:pointer;
}
.topic-pill:hover{border-color:var(--amber);color:var(--amber)}
.brain-flow{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;
}
.bf-step{
  padding:12px 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);
  display:flex;align-items:flex-start;gap:10px;font-size:.85rem;
}
.bf-num{
  width:26px;height:26px;border-radius:8px;background:var(--amber-soft);color:var(--amber);
  border:1px solid var(--amber-line);display:grid;place-items:center;font-weight:800;flex:none;font-size:.8rem;
}
@media(max-width:680px){.brain-flow{grid-template-columns:1fr}}

/* CAT */
.cat-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.cat-top .timer{font-size:1.6rem}
.cat-body{display:grid;gap:14px}
@media(min-width:900px){.cat-body{grid-template-columns:1fr 300px;align-items:start}}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.num{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg2);color:var(--text);font:700 .85rem var(--font-body);cursor:pointer;position:relative;transition:transform .1s}
.num:hover{border-color:var(--amber);transform:scale(1.04)}
.num.ans{background:var(--teal);color:#04201c;border-color:var(--teal)}
.num.dbt{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.num.cur{outline:3px solid var(--text);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1.5px solid var(--line)}
.legend .a{background:var(--teal);border-color:var(--teal)}.legend .d{background:var(--amber);border-color:var(--amber)}.legend .b{background:var(--bg2)}

/* misc */
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border-radius:15px;background:var(--bg2);border:1px solid var(--line);font-size:.82rem;transition:transform .15s}
.bd .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.bd.on{border-color:var(--amber-line);background:linear-gradient(180deg,var(--amber-soft),var(--bg2))}
.bd.on .ico{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);box-shadow:0 4px 14px rgba(245,185,66,.3)}
.bd.off{opacity:.52}
.status{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.04em}
.status.lolos{background:var(--green-soft);color:var(--green);border:1px solid var(--green-line)}
.status.belum{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.notice{padding:13px 16px;border-radius:14px;background:var(--amber-soft);border:1px solid var(--amber-line);font-size:.92rem;line-height:1.55}
.notice.teal{background:var(--teal-soft);border-color:var(--teal-line)}
.notice.red{background:var(--red-soft);border-color:var(--red-line)}
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--text);padding:24px;max-width:min(560px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(3,7,18,.72);backdrop-filter:blur(3px)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:80;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
@media(min-width:900px){.toasts{bottom:24px}}
.toast{background:var(--card2);border:1.5px solid var(--amber);color:var(--text);padding:11px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:700;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fadein{animation:rise .32s ease both}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
@media(max-width:520px){.hbar{grid-template-columns:100px 1fr 48px}.form-grid{grid-template-columns:1fr}}
.pomo{text-align:center}
.pomo .timer{font-size:4.2rem;margin:10px 0}
details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";color:var(--amber);font-size:1.1rem;transition:transform .2s;margin-left:10px}
details[open]>summary::after{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

/* ============================ PLAN ENGINE ============================ */
function dayType(k) {

  if (k === 2) return 'taper2';
  if (k > K.HARI_PENUH) return 'ringan';
  if (k === K.BASELINE) return 'sim';
  if (k > K.FASE1_AKHIR - 1) return 'harian';                // H-27..H-25
  if (k > K.FASE2_AKHIR - 1) {                               // H-24..H-11
    if (K.RINGAN_FASE2.indexOf(k) >= 0) return 'ringan';
    if (K.SIM_FASE2.indexOf(k) >= 0) return 'sim';
    return 'harian';
  }
  return K.SIM_FASE3.indexOf(k) >= 0 ? 'sim' : 'fokus';      // H-10..H-3
}
function phaseOf(k) {
  const K = CONFIG.KALENDER;

  if (k >= K.FASE1_AKHIR) return 1;
  if (k >= K.FASE2_AKHIR) return 2;
  if (k >= K.FASE3_AKHIR) return 3;

}

function buildCalendar(examStr, startStr) {

  const K = CONFIG.KALENDER, kStart = diffDays(startStr || examStr, examStr), out = [];
  if (kStart < 0) return out;
  for (let k = kStart; k >= 0; k--) {
    const date = addDays(examStr, -k), type = dayType(k);

  }

    out[0].type = 'sim'; out[0].baseline = true;     // Fase 1 dipadatkan jadi 1 hari baseline
  }
  return out;

  let m = o.qid ? state.mistakes.find(x => x.qid === o.qid) : null;
  if (m) { m.box = 1; m.mastered = false; m.due = addDays(t, INT[0]); m.wrongCount = (m.wrongCount || 1) + 1; return m; }
  m = { id: uid(), qid: o.qid || null, text: o.text || '', subtes: o.subtes, topik: o.topik || '', rule: o.rule || '', box: 1, due: addDays(t, INT[0]), created: t, wrongCount: 1, mastered: false, reviews: 0 };
  state.mistakes.push(m); return m;
}

  const t = today(), INT = CONFIG.LEITNER.INTERVAL_HARI, maxBox = INT.length;
  if (ok) {
    if (m.box >= maxBox) { m.mastered = true; m.due = null; }
    else { m.box++; m.due = addDays(t, INT[m.box - 1]); }
  } else { m.box = 1; m.mastered = false; m.due = addDays(t, INT[0]); }

}

/* ============================ STREAK ============================ */
function reconcileStreak() {
  const s = state.streak, y = addDays(today(), -1);
  if (!s.last) return;
  let d = addDays(s.last, 1), used = 0;
  while (d <= y) {
    if (s.count > 0) {
      if (s.freezes > 0) { s.freezes--; s.frozenDates.push(d); s.last = d; used++; }
      else { s.count = 0; s.last = y; break; }
    } else { s.last = y; break; }
    d = addDays(d, 1);
  }
  if (used) { save(); setTimeout(() => toast('Freeze streak terpakai ' + used + 'x. Sisa ' + s.freezes + '.'), 600); }
}
function creditStreak(date) {
  const s = state.streak;
  if (s.last === date) return;
  reconcileStreak();
  if (s.count > 0 && s.last === addDays(date, -1)) s.count++; else s.count = 1;
  s.last = date; s.best = Math.max(s.best, s.count);
  toast('Streak ' + s.count + ' hari!');
}

function formatStemHTML(q) {

  const mXY = raw.match(/^([\s\S]*?)\nX\s*=\s*([^\n]+)\nY\s*=\s*([^\n]+)\n+([\s\S]*)$/);
  if (mXY) {
    const intro = mXY[1].replace(/^Perbandingan Kuantitatif:\s*/i, '').trim();
    const xVal = mXY[2].trim(), yVal = mXY[3].trim(), outro = mXY[4].trim();
    html += (intro ? '<p class="qtext" style="margin-bottom:10px">' + esc(intro) + '</p>' : '') +
      '<div class="tbl-wrap" style="margin:10px 0 14px"><table class="tbl" style="border:1px solid var(--line);background:var(--bg2)">' +
      '<thead><tr style="background:rgba(56,189,248,.12)"><th style="width:50%;text-align:center;color:var(--tiu);font-size:.95rem">Kuantitas X</th><th style="width:50%;text-align:center;color:var(--amber);font-size:.95rem">Kuantitas Y</th></tr></thead>' +
      '<tbody><tr><td style="text-align:center;font-weight:700;padding:14px">' + esc(xVal) + '</td><td style="text-align:center;font-weight:700;padding:14px">' + esc(yVal) + '</td></tr></tbody></table></div>' +
      '<p class="qtext" style="margin-top:8px">' + esc(outro) + '</p>';
    return html;
  }
  // Deteksi format Premis Silogisme agar tampil terstruktur seperti layar CAT BKN
  if (/^Premis 1:/m.test(raw)) {
    const parts = raw.split(/\n\n+/);
    const prems = parts[0].split('\n').map(l => '<div style="padding:4px 0;border-bottom:1px dashed var(--line)">' + esc(l) + '</div>').join('');
    const rest = parts.slice(1).join('\n\n');
    html += '<div style="background:var(--bg2);border-left:4px solid var(--tiu);padding:10px 14px;border-radius:8px;margin:8px 0 12px;font-weight:500">' + prems + '</div>' +
      (rest ? '<p class="qtext" id="qt">' + esc(rest) + '</p>' : '');
    return html;
  }
  html += '<p class="qtext" id="qt">' + esc(raw) + '</p>';

}

    rec = { choice: choice, perm: perm, ok: r.ok, pts: r.pts, sec: Math.round(sec * 10) / 10, timeout: !!timeout };
    reveal();
    if (o.onAnswer) o.onAnswer(rec);
  }
  $$('.opt', host).forEach(b => { b.onclick = () => answer(+b.dataset.i); });
  if (rec) reveal();
  else if (o.perQSec) {
    const tEl = $('#qtimer', host);
    const tick = () => { const left = o.perQSec - (Date.now() - t0) / 1000; tEl.textContent = fmtClock(left); tEl.classList.toggle('low', left <= 10); if (left <= 0) answer(-1, true); };
    tick(); timerId = setInterval(tick, 250);
  }
  const kh = e => {
    if (destroyed || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (/INPUT|TEXTAREA|SELECT/.test(tag) || $('#dlg').open) return;
    const k = e.key.toLowerCase();
    if (!rec) {
      let dIdx = -1;
      if (/^[1-8]$/.test(k)) dIdx = +k - 1; else if (k.length === 1 && 'abcdefgh'.indexOf(k) >= 0) dIdx = 'abcdefgh'.indexOf(k);
      if (dIdx >= 0 && dIdx < perm.length) { e.preventDefault(); answer(perm[dIdx]); }
    } else if (e.key === 'Enter' && tag !== 'BUTTON') { const nb = $('#qnext', host); if (nb) { e.preventDefault(); nb.click(); } }
  };
  document.addEventListener('keydown', kh);
  const ctl = { destroy() { destroyed = true; clearInterval(timerId); document.removeEventListener('keydown', kh); } };
  onLeave(ctl.destroy);
  return ctl;
}

function summarize(st) {
  const res = { n: 0, ok: 0, pts: 0, sec: 0, bySubtes: {}, wrong: [], qids: st.qids.slice() };
  st.qids.forEach(id => {
    const q = getQ(id), r = st.ans[id]; if (!q || !r) return;
    res.n++; if (r.ok) res.ok++; res.pts += r.pts; res.sec += r.sec || 0;
    const b = res.bySubtes[q.subtes] || (res.bySubtes[q.subtes] = { b: 0, t: 0, p: 0, topics: {} });
    b.t++; b.p += r.pts; if (r.ok) b.b++;
    const tp = b.topics[q.topik] || (b.topics[q.topik] = [0, 0, 0]);
    tp[1]++; tp[2] += r.pts; if (r.ok) tp[0]++;
    if (!r.ok) res.wrong.push({ id: q.id, choice: r.choice });
  });
  return res;
}

function runQuiz(host, cfg) {
  const st = cfg.state; let ctl = null;
  host.innerHTML = '';

    if (ctl) { ctl.destroy(); ctl = null; }

    ctl = mountQuestion(wrap, q, {
      idx: st.i, total: st.qids.length, perQSec: cfg.perQSec, reveal: cfg.reveal, prev: st.ans[q.id],
      nextLabel: st.i === st.qids.length - 1 ? 'Lihat hasil' : 'Soal berikutnya',
      onAnswer: rec => { st.ans[q.id] = rec; applyAnswer(q, rec); if (cfg.onAnswer) cfg.onAnswer(q, rec); if (cfg.onProgress) cfg.onProgress(st); },
      onNext: () => { st.i++; if (cfg.onProgress) cfg.onProgress(st); show(); window.scrollTo(0, 0); }
    });
  }
  show();
  return { destroy() { if (ctl) ctl.destroy(); } };
}

function runReview(host, cfg) {
  const st = cfg.state; let ctl = null;
  if (st.ok == null) st.ok = 0; if (st.sec == null) st.sec = 0;
  function next() { st.i++; if (cfg.onProgress) cfg.onProgress(st); show(); }
  function show() {
    if (ctl) { ctl.destroy(); ctl = null; }
    if (st.i >= cfg.ids.length) { cfg.onFinish({ total: cfg.ids.length, ok: st.ok, sec: st.sec }, host); return; }
    const m = state.mistakes.find(x => x.id === cfg.ids[st.i]);
    if (!m) { st.i++; show(); return; }
    const last = st.i === cfg.ids.length - 1, q = m.qid && getQ(m.qid);

        idx: st.i, total: cfg.ids.length, reveal: 'direct', nextLabel: last ? 'Selesai' : 'Berikutnya',
        onAnswer: rec => { leitnerResult(m, rec.ok); qstatUpdate(q, rec); if (rec.ok) st.ok++; st.sec += rec.sec || 0; save(); },

const sp = (d, key) => d.p[key] || (d.p[key] = {});
function startSession(mode) {
  const info = todayInfo(); if (!info) return null;
  const d = getDay(info.date);
  if (!d.started) {
    d.started = Date.now(); d.mode = mode || 'penuh'; d.type = info.type; d.k = info.k;
    d.menu = menuFor(info.type, state.settings.hours, d.mode, info.baseline);
  }
  save(); return d;
}
function completeStep(d, step) {
  const p = sp(d, step.key); if (p.done) return;
  p.done = true; p.doneAt = Date.now();
  const el = p.t0 ? (Date.now() - p.t0) / 60000 : step.min, credit = Math.min(el, step.min * 1.5);
  p.min = Math.round(credit * 10) / 10;
  if (step.kind !== 'sim') addStudy(credit, d.date);
  addXP(CONFIG.XP.LANGKAH, null, true);
  if (!d.credited && d.menu.filter(s => s.core).every(s => sp(d, s.key).done)) { d.credited = true; creditStreak(d.date); }
  if (d.menu.every(s => sp(d, s.key).done) && !d.done) {
    d.done = true; d.doneAt = Date.now(); addXP(CONFIG.XP.HARI_SELESAI, 'hari selesai'); confetti(150);
  }
  commit();
}
function finishCard(host, html, d) {

function simPlanInfo() {
  const av = {}; CONFIG.SUBTES.forEach(s => { av[s] = bankCount(s); });
  const full = CONFIG.SUBTES.every(s => av[s] >= CONFIG.SIM.SOAL[s]);
  const jKey = state && state.settings && state.settings.jalur;
  const durFull = (CONFIG.JALUR_FORMASI && CONFIG.JALUR_FORMASI[jKey] && CONFIG.JALUR_FORMASI[jKey].durasiMenit) || CONFIG.SIM.DURASI_MENIT;
  if (full) return { mini: false, counts: Object.assign({}, CONFIG.SIM.SOAL), minutes: durFull, total: CONFIG.SIM.TOTAL_SOAL };
  // Simulasi Mini: proporsi 30:35:45 diskalakan sebesar mungkin sesuai bank yang tersedia
  const f = Math.min.apply(null, CONFIG.SUBTES.map(s => av[s] / CONFIG.SIM.SOAL[s]));
  const counts = {};
  CONFIG.SUBTES.forEach(s => { counts[s] = Math.max(av[s] ? 1 : 0, Math.min(av[s], Math.round(f * CONFIG.SIM.SOAL[s]))); });
  const total = sum(CONFIG.SUBTES.map(s => counts[s]));
  return { mini: true, counts, total, minutes: Math.max(1, Math.round(durFull * total / CONFIG.SIM.TOTAL_SOAL)) };
}

function mountStep(host, d, step) {

    case 'tkp': { if (!p.qids) { p.qids = pickQuestions({ subtes: 'TKP', n: step.n }); save(); } quizStep(host, d, step, p, ''); break; }
    case 'bk': {

function userProfilesAggregate() {
  const map = {};
  const ensure = (u, inst) => {
    const k = (u || 'Peserta Utama').trim() || 'Peserta Utama';
    if (!map[k]) map[k] = { user: k, instansi: inst || '', sims: [], logs: [], topics: {}, wrongQids: {}, labels: { ceroboh: 0, 'tidak tahu': 0, 'kehabisan waktu': 0 } };
    if (inst && !map[k].instansi) map[k].instansi = inst;
    return map[k];
  };
  state.sims.forEach(s => {
    const p = ensure(s.user, s.instansi);
    p.sims.push(s);
    (s.perQ || []).forEach(r => {
      if (!r.ok && r.id) p.wrongQids[r.id] = (p.wrongQids[r.id] || 0) + 1;
      if (!r.ok && r.label && p.labels[r.label] != null) p.labels[r.label]++;
    });
  });
  state.log.forEach(e => {
    const p = ensure(e.user, e.instansi);
    p.logs.push(e);
    Object.keys(e.topics || {}).forEach(t => {
      const x = e.topics[t], tk = e.subtes + '|' + t;
      const o = p.topics[tk] || (p.topics[tk] = { subtes: e.subtes, topik: t, ok: 0, tot: 0, pts: 0 });
      o.ok += x[0] || 0; o.tot += x[1] || 0; o.pts += x[2] || 0;
    });
    (e.wrong || []).forEach(w => { if (w && w.id) p.wrongQids[w.id] = (p.wrongQids[w.id] || 0) + 1; });
  });
  return Object.keys(map).map(k => {
    const p = map[k];
    const sortedSims = p.sims.slice().sort(compareBknSim);
    p.bestSim = sortedSims[0] || null;
    p.bestScore = p.bestSim ? p.bestSim.total : 0;
    p.avgSim = p.sims.length ? Math.round(sum(p.sims.map(x => x.total)) / p.sims.length) : null;
    p.totalQ = sum(p.logs.map(x => x.total || 0));
    p.weakList = Object.keys(p.topics).map(tk => {
      const o = p.topics[tk];
      o.acc = o.tot ? (o.subtes === 'TKP' ? o.pts / (CONFIG.SKOR.TKP_MAX * o.tot) : o.ok / o.tot) : 0;
      return o;
    }).filter(o => o.tot > 0).sort((a, b) => a.acc - b.acc);
    p.topWrong = Object.keys(p.wrongQids).map(qid => ({ qid, cnt: p.wrongQids[qid], q: getQ(qid) })).filter(x => x.q).sort((a, b) => b.cnt - a.cnt);
    return p;
  }).sort((a, b) => (b.bestScore - a.bestScore) || (b.totalQ - a.totalQ));
}

function barChart(data, o) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('Backup diunduh');
}
function importDataText(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { toast('File bukan JSON yang valid.'); return; }
  const s = obj && (obj.state || obj);
  if (!s || typeof s !== 'object' || !s.settings || !Array.isArray(s.log || [])) { toast('Format backup tidak dikenali.'); return; }
  confirmDialog('Pulihkan data dari backup?', 'Semua data saat ini akan <strong>diganti</strong> dengan isi backup' + (obj.exportedAt ? ' (' + esc(new Date(obj.exportedAt).toLocaleString('id-ID')) + ')' : '') + '.', 'Pulihkan', true).then(ok => {
    if (!ok) return;
    state = normalize(s); save(); rebuildQuestions(); applyTheme(); toast('Data berhasil dipulihkan'); render();
  });
}
function parseQuestionJSON(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return { fatal: 'JSON tidak valid: ' + e.message }; }
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.soal) ? data.soal : null);
  if (!arr) return { fatal: 'Format harus berupa array soal, atau objek {"soal":[...]}.' };
  if (!arr.length) return { fatal: 'Array soal kosong.' };
  const seen = Object.assign({}, QMAP), valid = [], errors = [];
  arr.forEach((o, i) => {
    const e = validateQuestion(o, seen);
    if (e.length) errors.push('Soal #' + (i + 1) + (o && o.id ? ' (' + o.id + ')' : '') + ': ' + e.join('; '));
    else { seen[o.id] = true; valid.push(Object.assign({}, o, { verified: o.verified === true })); }
  });
  return { valid, errors };
}

/* ============================ ROUTER & INIT ============================ */
function materiBlock(subtes, topik) {
  const list = (window.MATERI && window.MATERI[subtes]) || [];
  const m = list.find(x => x.topik === topik); if (!m) return '';
  let out = '';
  if (m.ringkas) {
    out += '<p class="muted" style="margin:6px 0 12px;font-size:.95rem">' + esc(m.ringkas) + '</p>';
  }
  // 1. Jembatan Keledai (Mnemonic Anchor - Von Restorff Isolation Effect)
  if (m.jembatan) {
    out += '<div class="mnemonic-box">' +
      '<div class="m-ico">' + ic('bulb') + '</div>' +
      '<div class="grow"><div class="m-title">Jembatan Keledai &amp; Kunci Ingatan Cepat</div><div class="m-body">' + richText(m.jembatan) + '</div></div>' +
    '</div>';
  }
  // 2. Peta Konsep Visual (Chunking Dual-Coding Grid)
  if (m.peta && m.peta.length) {
    out += '<div class="eyebrow" style="margin-top:14px">Peta Konsep Visual (Chunking)</div>' +
      '<div class="peta-grid">' + m.peta.map(p =>
        '<div class="peta-card sub-' + esc(subtes) + '" data-reveal>' +
          '<div class="peta-k"><span>' + esc(p.k) + '</span></div>' +
          '<div class="peta-v">' + richText(p.v) + '</div>' +
        '</div>'
      ).join('') + '</div>';
  }
  // 3. Kartu Hafalan Kilat (Active Recall Flip / Tap-to-Reveal)
  if (m.hafal && m.hafal.length) {
    out += '<div class="row between" style="margin-top:14px"><div class="eyebrow" style="margin:0;color:var(--amber)">Kartu Hafalan Wajib (Ketuk kartu untuk uji ingatan)</div></div>' +
      '<div class="flash-grid">' + m.hafal.map(h => {
        const eq = h.indexOf('=');
        const k = eq > 0 ? h.slice(0, eq).trim() : 'Hafalan Kunci';
        const v = eq > 0 ? h.slice(eq + 1).trim() : h;
        return '<button type="button" class="flash-card" data-flash>' +
          '<div class="flash-q"><span>' + ic('star', 'sm') + ' ' + esc(k) + '</span><span class="cloak-hint">Ketuk uji</span></div>' +
          '<div class="flash-a">' + richText(v) + '</div>' +
        '</button>';
      }).join('') + '</div>';
  }
  // 4. Jebakan Soal vs Trik Cepat (Semantic Contrast)
  if (m.tips && m.tips.length) {
    out += '<div class="eyebrow" style="margin-top:14px">Jebakan Pengecoh vs Trik Cepat</div>' +
      '<div class="tip-grid">' + m.tips.map(t => {
        const isTrap = /jebakan|salah|hindari/i.test(t);
        const clean = t.replace(/^(JEBAKAN|TRIK CEPAT)\s*:\s*/i, '');
        return '<div class="tip-box ' + (isTrap ? 'trap' : 'trick') + '">' +
          '<span style="margin-top:2px;color:var(--' + (isTrap ? 'red' : 'teal') + ')">' + ic(isTrap ? 'alert' : 'bolt') + '</span>' +
          '<div><span class="t-tag">' + (isTrap ? 'Awas Jebakan Soal' : 'Trik Cepat Skor Tinggi') + '</span>' + richText(clean) + '</div>' +
        '</div>';
      }).join('') + '</div>';
  }
  // 5. Inti Materi Lengkap (Scannable Highlighted List)
  if (m.inti && m.inti.length) {
    out += '<details style="margin-top:10px"><summary class="small muted">Rincian Konsep &amp; Kisi-kisi Lengkap (' + m.inti.length + ' poin)</summary>' +
      '<ul class="inti-list">' + m.inti.map(x => '<li>' + richText(x) + '</li>').join('') + '</ul></details>';
  }
  return out;
}
function bindMateriInteractions(root) {
  $$('[data-flash], [data-reveal]', root).forEach(el => {
    el.onclick = () => { el.classList.toggle('revealed'); };
  });
  $$('mark.hl', root).forEach(m => {
    m.onclick = e => { e.stopPropagation(); m.classList.toggle('revealed'); };
  });
}

      (umum.peta ? '<div class="peta-grid" style="margin-top:12px">' + umum.peta.map(p => '<div class="peta-card sub-' + esc(p.tag || 'TWK') + '"><div class="peta-k">' + esc(p.k) + '</div><div class="peta-v">' + richText(p.v) + '</div></div>').join('') + '</div>' : '') +

    }).join('') + '</div>' +
    list.map((m, i) => {

      const qCnt = bankCount(sub, m.topik), subTot = Math.max(1, bankCount(sub));
      const pShare = Math.round(qCnt * 100 / subTot);
      return '<details class="card sub-' + sub + ' topic-card" id="top-' + i + '" style="margin-bottom:16px"' + (i === 0 ? ' open' : '') + '>' +
